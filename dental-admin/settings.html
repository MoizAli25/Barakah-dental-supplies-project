<!doctype html>
<html>
<head>
  <meta charset="utf-8"/><meta name="viewport"content="width=device-width,initial-scale=1"/>
  <title>Settings - Barakah Dental Supplies – Admin Panel</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-settings">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img src="assets/BARAKAH-LOGO.png" alt="" style="width: 100%;"></div>
      <nav class="nav">
        <a href="index.html"> Dashboard</a>
        <a href="products.html"> Products</a>
        <a href="media.html"> Media</a>
        <a href="orders.html"> Orders</a>
        <a href="users.html"> Users</a>
        <a href="settings.html" class="active"> Settings</a>
        <a href="#" onclick="doLogout()"> Logout</a>
      </nav>
    </aside>

    <main class="main">
      <header class="header"><div><h1>Settings</h1></div></header>
      <section class="card">
        <h3>Site Configuration</h3>
        <form id="settingsForm">
          <label>Site Title</label>
          <input name="siteTitle" type="text" />
          <label>Brand Color</label>
          <input name="brandColor" type="color" />
          <div style="margin-top:12px;"><button class="btn btn-primary" type="submit">Save Settings</button></div>
        </form>
      </section>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
  <script>appInit();</script>

  <script>
  const session = JSON.parse(localStorage.getItem("session"));

  if (!session || session.role !== "admin") {
    // ❌ Redirect customers and guests
    window.location.href = "../frontend/login.html";
  }
</script>

</body>
</html>
